<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabshare — Rede Social</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- ── AUTH SCREEN ──────────────────────────────────────────────────────── -->
    <div id="auth-screen">
      <div class="auth-box">
        <div class="auth-logo">
          <svg
            viewBox="0 0 34 34"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              width="34"
              height="34"
              rx="10"
              fill="#7c6bff"
              opacity="0.15"
            />
            <circle cx="17" cy="12" r="4" fill="#7c6bff" />
            <circle cx="9" cy="24" r="3" fill="#a78bfa" />
            <circle cx="25" cy="24" r="3" fill="#a78bfa" />
            <line
              x1="17"
              y1="16"
              x2="9"
              y2="21"
              stroke="#7c6bff"
              stroke-width="1.5"
            />
            <line
              x1="17"
              y1="16"
              x2="25"
              y2="21"
              stroke="#7c6bff"
              stroke-width="1.5"
            />
          </svg>
          <span>Gabshare</span>
        </div>

        <div class="auth-tabs">
          <button
            class="tab-btn active"
            id="tab-login"
            onclick="switchTab('login')"
          >
            Entrar
          </button>
          <button
            class="tab-btn"
            id="tab-register"
            onclick="switchTab('register')"
          >
            Criar conta
          </button>
        </div>

        <div id="auth-msg" role="alert"></div>

        <!-- Login form -->
        <form id="login-form" onsubmit="handleLogin(event)" novalidate>
          <div class="form-group">
            <label for="login-name">Nome de usuário</label>
            <input
              id="login-name"
              type="text"
              placeholder="seu_nome"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label for="login-pass">Senha</label>
            <input
              id="login-pass"
              type="password"
              placeholder="••••••"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn-primary" id="btn-login">
            Entrar
          </button>
        </form>

        <!-- Register form (hidden initially) -->
        <form
          id="register-form"
          style="display: none"
          onsubmit="handleRegister(event)"
          novalidate
        >
          <div class="form-group">
            <label for="reg-name">Nome de usuário</label>
            <input
              id="reg-name"
              type="text"
              placeholder="seu_nome"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label for="reg-email">Gmail / E-mail</label>
            <input
              id="reg-email"
              type="email"
              placeholder="voce@gmail.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="reg-pass">Senha</label>
            <input
              id="reg-pass"
              type="password"
              placeholder="mínimo 4 caracteres"
              autocomplete="new-password"
              required
            />
          </div>
          <button type="submit" class="btn-primary" id="btn-register">
            Criar conta
          </button>
        </form>
      </div>
    </div>

    <!-- ── APP SCREEN ───────────────────────────────────────────────────────── -->
    <div id="app-screen">
      <!-- Header (sticky) -->
      <div class="app-header">
        <div class="header-left">
          <span class="header-logo">Gabshare</span>
          <span class="header-user"
            >Olá, <strong id="header-name"></strong
          ></span>
        </div>
        <button class="btn-logout" onclick="handleLogout()">Sair</button>
      </div>

      <!-- Post composer -->
      <div class="composer">
        <p id="post-msg" role="alert"></p>
        <div class="composer-top">
          <div class="avatar" id="composer-avatar"></div>
          <textarea
            id="post-content"
            placeholder="O que está acontecendo?"
            maxlength="280"
            oninput="updateCharCount()"
          ></textarea>
        </div>
        <div class="composer-footer">
          <span id="char-count">0 / 280</span>
          <button class="btn-post" onclick="handlePost()" id="btn-post">
            Publicar
          </button>
        </div>
      </div>

      <!-- Feed tabs -->
      <div class="feed-tabs">
        <button class="feed-tab-btn active" id="tab-general" onclick="switchFeedTab('general')">Feed Geral</button>
        <button class="feed-tab-btn" id="tab-following" onclick="switchFeedTab('following')">Seguindo</button>
      </div>

      <!-- Feed -->
      <div id="feed">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script src="./app.js"></script>
  </body>
</html>
